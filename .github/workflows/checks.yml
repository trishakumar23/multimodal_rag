name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build test image and run tests
        run: docker compose --profile test run --build --rm tests
      - name: Check lint and formatting
        run: |
          docker compose --profile test run --rm tests python -m ruff check --no-cache app tests
          docker compose --profile test run --rm tests python -m ruff format --check --no-cache app tests
      - name: Build and start application
        run: docker compose up --build --detach --wait --wait-timeout 120 app
      - name: Verify HTTP and persistent storage permissions
        run: |
          curl --fail http://127.0.0.1:8000/health
          curl --fail --output /dev/null http://127.0.0.1:8000/docs
          docker compose exec -T app python -c "import os; from pathlib import Path; assert os.getuid() != 0; assert Path('/data/db/multimodal_rag.db').is_file(); paths = [Path('/data/images/.write-check'), Path('/app/local/models/.write-check')]; [(p.write_text('ok'), p.unlink()) for p in paths]"
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up CI volumes
        if: always()
        run: docker compose down --volumes
